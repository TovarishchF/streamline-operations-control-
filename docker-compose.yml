# Один файл с профилями dev / demo / prod (INFRA.md § 1).
# Разница между окружениями — переменные окружения и набор вспомогательных
# сервисов, а не разные конфигурации. Отдельного «демо-кода» не существует.

name: soc

x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file: [.env]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  volumes:
    - ./backend:/app
    - ./shared:/shared:ro
    - ./openapi.yaml:/openapi.yaml:ro
    # Отчёты и выгрузки пишутся сюда и остаются на хосте (CLAUDE.md § 4).
    - ./artifacts:/artifacts

services:

  db:
    image: postgres:16-alpine
    profiles: [dev, demo, prod]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soc}
      POSTGRES_USER: ${POSTGRES_USER:-soc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # База наружу не публикуется (INFRA.md § 6). Порт открыт только на петле
    # и только ради подключения инструментов с хоста. Номер настраивается:
    # 5432 на Windows часто попадает в диапазон, зарезервированный Hyper-V.
    ports: ["127.0.0.1:${DB_HOST_PORT:-15432}:5432"]

  redis:
    image: redis:7-alpine
    profiles: [dev, demo, prod]
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [dev, demo, prod]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    <<: *backend-base
    profiles: [dev, demo, prod]
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]

  worker:
    <<: *backend-base
    profiles: [dev, demo, prod]
    command: celery -A config worker -l info
    # Проверка из образа обращается к HTTP, которого у воркера нет.
    # Живость воркера — это ответ на ping через брокер.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  beat:
    <<: *backend-base
    profiles: [dev, demo, prod]
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    # У планировщика нет ни HTTP, ни очереди, к которой можно обратиться:
    # состояние видно по журналу. Ложная проверка хуже отсутствующей.
    healthcheck:
      disable: true

  web:
    # Контекст — корень репозитория: сборке нужен каталог shared/ (см. web/Dockerfile).
    build:
      context: .
      dockerfile: web/Dockerfile
      target: dev
    profiles: [dev, demo, prod]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_API_PROXY_TARGET: http://api:8000
    ports: ["5173:5173"]
    volumes:
      - ./web:/app/web
      - ./shared:/app/shared:ro
      - /app/web/node_modules

  # ─── Только dev и демонстрационный стенд ───

  # Почта реально отправляется и видна в веб-интерфейсе, но наружу не уходит
  # (INTEGRATIONS § 3.1). Это честнее, чем «сообщение помечено отправленным».
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: [dev, demo]
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  # Тестовый каталог: механизм LDAP проверяется по-настоящему ещё до получения
  # доступа к домену заказчика (INTEGRATIONS § 4.1).
  #
  # bitnami/openldap снят с публикации в 2025 году, образы перенесены в архивный
  # реестр bitnamilegacy с тем же набором переменных. Каталог нужен только в dev
  # и на стенде, в бою используется домен заказчика, поэтому замороженный образ
  # здесь допустим.
  openldap:
    image: bitnamilegacy/openldap:2.6.10
    profiles: [dev, demo]
    environment:
      LDAP_ROOT: dc=soc,dc=local
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: adminpassword
      LDAP_USERS: dispatcher1,finance1
      LDAP_PASSWORDS: password1,password2
      LDAP_GROUP: soc-dispatchers
    ports: ["127.0.0.1:1389:1389"]

  # ─── Наблюдаемость: prod и стенд ───

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [demo, prod]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.5.1
    profiles: [demo, prod]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]

volumes:
  db-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
