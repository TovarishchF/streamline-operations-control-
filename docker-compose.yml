# Один файл с профилями dev / demo / prod (INFRA.md § 1).
# Разница между окружениями — переменные окружения и набор вспомогательных
# сервисов, а не разные конфигурации. Отдельного «демо-кода» не существует.

name: soc

x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file: [.env]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  volumes:
    - ./backend:/app
    - ./shared:/shared:ro
    - ./openapi.yaml:/openapi.yaml:ro

services:

  db:
    image: postgres:16-alpine
    profiles: [dev, demo, prod]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soc}
      POSTGRES_USER: ${POSTGRES_USER:-soc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # База наружу не публикуется (INFRA.md § 6). Порт открыт только в dev.
    ports: ["127.0.0.1:5432:5432"]

  redis:
    image: redis:7-alpine
    profiles: [dev, demo, prod]
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: [dev, demo, prod]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    <<: *backend-base
    profiles: [dev, demo, prod]
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]

  worker:
    <<: *backend-base
    profiles: [dev, demo, prod]
    command: celery -A config worker -l info

  beat:
    <<: *backend-base
    profiles: [dev, demo, prod]
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    profiles: [dev, demo, prod]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports: ["5173:5173"]
    volumes:
      - ./web:/app
      - ./shared:/shared:ro
      - /app/node_modules

  # ─── Только dev и демонстрационный стенд ───

  # Почта реально отправляется и видна в веб-интерфейсе, но наружу не уходит
  # (INTEGRATIONS § 3.1). Это честнее, чем «сообщение помечено отправленным».
  mailpit:
    image: axllent/mailpit:latest
    profiles: [dev, demo]
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  # Тестовый каталог: механизм LDAP проверяется по-настоящему ещё до получения
  # доступа к домену заказчика (INTEGRATIONS § 4.1).
  openldap:
    image: bitnami/openldap:2.6
    profiles: [dev, demo]
    environment:
      LDAP_ROOT: dc=soc,dc=local
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: adminpassword
      LDAP_USERS: dispatcher1,finance1
      LDAP_PASSWORDS: password1,password2
      LDAP_GROUP: soc-dispatchers
    ports: ["127.0.0.1:1389:1389"]

  # ─── Наблюдаемость: prod и стенд ───

  prometheus:
    image: prom/prometheus:latest
    profiles: [demo, prod]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:latest
    profiles: [demo, prod]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]

volumes:
  db-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
