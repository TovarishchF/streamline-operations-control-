<!doctype html>
<html lang="ru" data-theme="light">
<head><meta charset="utf-8"><title>FlightStrip · Contrail mockup</title>
<link rel="stylesheet" href="../frame.css"><link rel="stylesheet" href="../../components/bundle.css">
<script src="../contrail.js"></script></head>
<body style="width:960px">
<div style="padding:16px;max-width:620px">
  <div class="ct-strip"><div class="ct-strip__id"><span class="no">SLG-1126</span><span class="tail">RA-67231 · CL60</span></div>
    <div class="ct-strip__leg"><div class="ct-strip__pt"><span class="icao">UUDD</span><span class="t">ETD 12:10Z</span></div>
      <div class="ct-strip__path"><svg viewBox="0 0 100 18" preserveAspectRatio="none"><path d="M2 15 Q50 -6 98 15"/></svg></div>
      <div class="ct-strip__pt ct-strip__pt--arr"><span class="icao">UNNT</span><span class="t">ETA 16:05Z</span></div></div>
    <div class="ct-strip__side"><span class="ct-pill ct-pill--sm ct-pill--ready">Готов к вылету</span><span class="ct-strip__eta is-soon">T−3:56</span></div></div>
  <div class="ct-strip"><div class="ct-strip__id"><span class="no">SLG-1154</span><span class="tail">RA-11500 · GL7T</span></div>
    <div class="ct-strip__leg"><div class="ct-strip__pt"><span class="icao">ULLI</span><span class="t">ETD 14:00Z</span></div>
      <div class="ct-strip__path"><svg viewBox="0 0 100 18" preserveAspectRatio="none"><path d="M2 15 Q50 -6 98 15"/></svg></div>
      <div class="ct-strip__pt ct-strip__pt--arr"><span class="icao">UUEE</span><span class="t">ETA 15:25Z</span></div></div>
    <div class="ct-strip__side"><span class="ct-pill ct-pill--sm ct-pill--progress">В работе · 4/6</span><span class="ct-strip__eta">T−5:46</span></div></div>
  <div class="ct-strip"><div class="ct-strip__id"><span class="no">SLG-1140</span><span class="tail">RA-67244 · CL60</span></div>
    <div class="ct-strip__leg"><div class="ct-strip__pt"><span class="icao">UUEE</span><span class="t">ETD 18:00Z</span></div>
      <div class="ct-strip__path"><svg viewBox="0 0 100 18" preserveAspectRatio="none"><path d="M2 15 Q50 -6 98 15"/></svg></div>
      <div class="ct-strip__pt ct-strip__pt--arr"><span class="icao">UACC</span><span class="t">ETA 21:30Z</span></div></div>
    <div class="ct-strip__side"><span class="ct-pill ct-pill--sm ct-pill--warning">Допуск RVSM</span><span class="ct-strip__eta">T−9:46</span></div></div>
</div>
</body></html>
