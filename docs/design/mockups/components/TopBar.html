<!doctype html>
<html lang="ru" data-theme="light">
<head><meta charset="utf-8"><title>TopBar · Contrail mockup</title>
<link rel="stylesheet" href="../frame.css"><link rel="stylesheet" href="../../components/bundle.css">
<script src="../contrail.js"></script></head>
<body style="width:960px">
<div style="padding:16px"><div style="border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden"><header class="ct-topbar">
  <div class="ct-crumbs">Операции <span class="ct-quiet">/</span> <b>Суточный план</b></div>
  <div class="ct-search"><span data-icon="Search" data-size="14"></span><span class="txt">Рейс, борт, клиент, аэропорт…</span><span class="ct-kbd">Ctrl K</span></div>
  <span class="ct-demo">Демо-стенд</span>
  <div class="ct-clock" title="Время UTC и местное"><span>08:13Z</span><span class="sep"></span><span class="lt">11:13 MSK</span></div>
  <button class="ct-iconbtn" aria-label="Уведомления: 5"><span data-icon="Bell"></span><span class="ct-count">5</span></button>
  <div class="ct-user"><span class="ct-avatar">ИК</span><span><div class="ct-user__name">Илья Карпов</div><div class="ct-user__role">Диспетчер</div></span></div>
</header>
</div></div>
<script>window.Contrail && Contrail.mountIcons();</script>
</body></html>
