<!doctype html>
<html lang="ru" data-theme="light">
<head><meta charset="utf-8"><title>PageHeader · Contrail mockup</title>
<link rel="stylesheet" href="../frame.css"><link rel="stylesheet" href="../../components/bundle.css">
<script src="../contrail.js"></script></head>
<body style="width:960px">
<div style="padding:20px 24px;display:grid;gap:14px">
  <div class="ct-page-head">
    <div class="ct-page-head__text">
      <h1 class="ct-page-title">Суточный план</h1>

    </div>

      <div class="ct-seg"><button class="is-active">Планшет</button><button>Таблица</button></div>
      <button class="ct-btn"><span data-icon="Calendar" data-size="14"></span>23.10.2026</button>

    </div>
  </div>
  <nav class="ct-tabs"><button class="ct-tab is-active">Суточный план</button><button class="ct-tab">Шаблоны рейсов <span class="n">12</span></button></nav>

<script>window.Contrail && Contrail.mountIcons();</script>
