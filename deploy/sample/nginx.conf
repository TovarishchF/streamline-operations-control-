# Установка для показа: веб-клиент, API и файлы под одним адресом.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Вложения до 25 МБ (MAX_ATTACHMENT_SIZE_BYTES) с запасом на заголовки.
    client_max_body_size 30m;

    # PWA и клиентская маршрутизация
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Файлы: браузер получает подписанную ссылку на хранилище (ADR-007).
    # Подпись покрывает адрес, поэтому хранилище открыто под адресом
    # системы (S3_PUBLIC_ENDPOINT), а Host передаётся как есть, с портом.
    location /soc/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
